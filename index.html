<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AGY Plus · RT 登录</title></head><body><main><div class="wordmark">agy<span>+</span></div><p class="eyebrow">ANTIGRAVITY CLI</p><h1>用 RT 登录 agy</h1><p class="intro">粘贴 Antigravity Refresh Token，<br>让下次启动的 agy 使用这个账号。</p><form id="login-form"><label for="refresh-token">Refresh Token</label><div class="input-wrap"><input id="refresh-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="粘贴你的 RT" required maxlength="16384"><button id="toggle" type="button" aria-label="显示 RT" aria-pressed="false">显示</button></div><p class="hint">使用 Antigravity 的 Google 登录凭据。</p><button id="submit" type="submit">登录 agy <span aria-hidden="true">↗</span></button></form><p id="status" role="status" aria-live="polite">准备就绪</p><footer>登录后，重新打开 agy CLI 会话。<br>Antigravity App / 新版 IDE 的共享账号也会更新。</footer></main><script type="module" src="/src/main.ts"></script></body></html>
